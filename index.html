<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Defense Prototype</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", sans-serif;
            background: #08101b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, rgba(48, 77, 122, 0.45), transparent 34%),
                linear-gradient(180deg, #08101b 0%, #0f1726 100%);
            color: #e4eef8;
        }

        main {
            width: 1640px;
            padding: 20px;
        }

        #app {
            width: 1600px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }

        canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .help {
            width: 1600px;
            margin: 14px auto 0;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(11, 18, 31, 0.72);
            color: #b4c4d8;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main>
        <div id="app"></div>
    </main>

    <script src="src/Library/p5.js"></script>
    <script src="src/Library/p5.sound.js"></script>
    <script src="src/Library/Midi.js"></script>
    <script src="src/Library/Tone.js"></script>
    <script src="src/FrontEnd/Button.js"></script>
    <script src="src/FrontEnd/scenes/MapOneScene.js"></script>
    <script src="src/FrontEnd/scenes/MenuScene.js"></script>
    <script src="src/FrontEnd/scenes/IntroScene.js"></script>
    <script src="src/FrontEnd/scenes/SelectCharacterScene.js"></script>
    <script src="src/FrontEnd/scenes/SelectDifficultyScene.js"></script>
    <script src="./FrontEnd/scenes/InstructionScene.js"></script>
    <script src="./FrontEnd/scenes/LoadingScene.js"></script>
    <script type="module" src="src/FrontEnd/Main.js"></script>

    
</body>
</html>
